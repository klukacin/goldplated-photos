# Standalone crate: deliberately not a member of the desktop/ workspace, since
# it only builds where a platform webview toolkit is available.
[workspace]

[package]
name = "gpp-desktop"
description = "Goldplated Photos desktop app"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"

[lib]
name = "gpp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Mirrors the core's `heif` feature so `--no-default-features` builds a
# HEIF-less shell end to end rather than silently keeping the decoder.
[features]
default = ["heif"]
heif = ["gpp-core/heif"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gpp-core = { path = "../../crates/gpp-core", default-features = false }
# protocol-asset backs `convertFileSrc`, which is how every thumbnail and
# preview in the grid is loaded from disk. It must match the assetProtocol
# block in tauri.conf.json or the build refuses to start.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
