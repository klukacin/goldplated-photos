[package]
name = "gpp-core"
description = "Goldplated Photos core: catalog, import, albums, publish, sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# NOTE: this crate must stay free of GUI and platform-specific process calls —
# it compiles for macOS, iOS, Windows and Linux unchanged.
[dependencies]
rusqlite.workspace = true
blake3.workspace = true
image.workspace = true
fast_image_resize.workspace = true
kamadak-exif.workspace = true
heif-oxide = "0.1"
rayon.workspace = true
walkdir.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
base64.workspace = true
rand.workspace = true
tracing.workspace = true
# Blocking HTTP for the sync transport. The sync engine is blocking by design
# (rayon, no async runtime), so a small blocking client fits where reqwest's
# async machinery would not.
#
# `platform-verifier` rather than the default bundled roots: a desktop app
# should trust what the operating system trusts — corporate CAs, user-added
# certificates — and it keeps the vendored Mozilla root bundle, which carries a
# CDLA-Permissive licence, out of the dependency tree.
ureq = { version = "3", default-features = false, features = [
  "json",
  "gzip",
  "rustls-no-provider",
  "_ring",
  "platform-verifier",
] }

[dev-dependencies]
tempfile.workspace = true
