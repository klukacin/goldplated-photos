[workspace]
resolver = "2"
members = ["crates/gpp-core", "crates/gpp-cli", "crates/gpp-ffi"]
# The Tauri shell needs platform webview toolkits (WKWebView on macOS,
# WebView2 on Windows, WebKitGTK on Linux). Keeping it out of the workspace
# means `cargo test` still runs the core anywhere, including CI containers
# without those libraries.
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Kristijan Lukacin"]
license = "UNLICENSED"
repository = "https://github.com/klukacin/goldplated-photos"

# Dependencies are pinned here so every crate agrees, and so the licence
# audit is a single place. Everything below is MIT / Apache-2.0 / BSD /
# CC0 — nothing copyleft links into the shipped binary.
#
# The rule holds for build-time tools too, which is why `gpp-ffi` hand-writes
# its C header: both obvious candidates for generating it, UniFFI and cbindgen,
# are Mozilla projects licensed MPL-2.0.
[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }  # MIT
blake3 = "1"                                                        # CC0/Apache-2.0
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif"] }  # MIT/Apache-2.0
fast_image_resize = { version = "5", features = ["image"] }        # MIT/Apache-2.0
kamadak-exif = "0.5"                                                # BSD-2-Clause
rayon = "1"                                                         # MIT/Apache-2.0
walkdir = "2"                                                       # MIT/Unlicense
serde = { version = "1", features = ["derive"] }                    # MIT/Apache-2.0
serde_json = "1"                                                    # MIT/Apache-2.0
thiserror = "2"                                                     # MIT/Apache-2.0
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }  # MIT/Apache-2.0
base64 = "0.22"                                                     # MIT/Apache-2.0
rand = "0.8"                                                        # MIT/Apache-2.0
tracing = "0.1"                                                     # MIT
tempfile = "3"                                                      # MIT/Apache-2.0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
