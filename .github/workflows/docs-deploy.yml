name: docs-deploy

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs-deploy.yml']
  workflow_dispatch:

concurrency:
  group: docs-deploy-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build docs
        run: |
          pip install mkdocs-material mkdocs-minify-plugin
          mkdocs build --strict -f docs/mkdocs.yml

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy --config docs/wrangler.jsonc
          curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/goldplated-docs/subdomain" \
            -d '{"enabled":true,"previews_enabled":false}' > /dev/null

      - name: Healthcheck
        run: |
          worker="https://goldplated-docs.nosco-703.workers.dev"
          public="https://docs.goldplated.photos"
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$worker/" || echo 000)
            [ "$code" = "200" ] && { echo "worker OK (200) $worker"; break; }
            echo "attempt $i: HTTP $code"; sleep 6
            [ "$i" = "10" ] && { echo "::error::worker healthcheck failed ($code)"; exit 1; }
          done
          for path in / /getting-started/quick-start/ /guides/workflow/ /sitemap.xml; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$worker$path" || echo 000)
            [ "$code" = "200" ] || { echo "::error::$path answered $code"; exit 1; }
          done
          echo "public $public -> HTTP $(curl -sS -o /dev/null -w '%{http_code}' "$public/" || echo 000)"