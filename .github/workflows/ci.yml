name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Web gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm test

      - name: Syntax-check admin server and scripts
        run: |
          for f in admin/server.js admin/js/*.js scripts/*.mjs; do
            node --check "$f"
          done
          bash -n scripts/deploy.sh

      - name: Build
        run: npm run build

  desktop-core:
    name: Desktop core (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # The Tauri shell is excluded from the workspace on purpose — it needs a
      # platform webview toolkit. The core and CLI build anywhere.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Release build (CLI)
        run: cargo build --release -p gpp-cli
