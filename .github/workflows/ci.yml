name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm test

      - name: Syntax-check admin server and scripts
        run: |
          for f in admin/server.js admin/js/*.js scripts/*.mjs; do
            node --check "$f"
          done
          bash -n scripts/deploy.sh

      - name: Build
        run: npm run build
